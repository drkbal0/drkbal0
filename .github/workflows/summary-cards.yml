name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUMMARY_CARDS_TOKEN }}

      # 1. Genera las gráficas de pastel y el cuadro de commits
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        with:
          USERNAME: drkbal0
          THEME: github_dark

      # 2. Genera la tarjeta con TODOS los lenguajes (incluyendo privados)
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-langs.svg
          token: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          user: drkbal0
          template: classic
          base: ""
          config_timezone: America/Hermosillo
          plugin_languages: yes
          plugin_languages_limit: 0
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          committer_token: ${{ secrets.SUMMARY_CARDS_TOKEN }}
